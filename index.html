<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#166534"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Control Despensas"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png"><title>Control de Despensas</title>
<style>
:root{--green:#166534;--green2:#15803d;--bg:#f4f7f4;--card:#fff;--text:#17231b;--muted:#647067;--line:#dbe5dc;--red:#b91c1c;--amber:#92400e}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{background:var(--green);color:white;padding:18px 16px 14px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;font-size:13px;opacity:.88}.wrap{max-width:1000px;margin:auto;padding:14px 12px 90px}.nav{display:flex;gap:7px;overflow:auto;padding:10px 0;position:sticky;top:76px;background:var(--bg);z-index:4}.nav button{white-space:nowrap;border:1px solid var(--line);background:white;color:var(--text);border-radius:999px;padding:9px 13px;font-weight:650}.nav button.active{background:var(--green);color:white;border-color:var(--green)}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 2px 7px #16351a08}.card h2{font-size:18px;margin:0 0 12px}.card h3{font-size:15px;margin:0 0 9px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{background:#f8fbf8;border:1px solid var(--line);border-radius:12px;padding:12px}.stat .num{font-size:25px;font-weight:800;margin-top:5px}.stat .lbl{font-size:12px;color:var(--muted)}label{display:block;font-size:13px;font-weight:650;margin:9px 0 5px}input,select,textarea{font:inherit;width:100%;border:1px solid #cbd5ce;border-radius:9px;padding:10px;background:white;color:var(--text);min-width:0}textarea{min-height:70px}button{font:inherit;cursor:pointer}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;background:var(--green);color:white}.btn.secondary{background:#e8f1e9;color:var(--green)}.btn.danger{background:#fee2e2;color:#991b1b}.btn.small{padding:7px 9px;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row .fit{flex:0 0 auto}.ingredient{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0}.ingredient .row{align-items:end}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:700}.pill{display:inline-block;background:#e8f1e9;color:var(--green);border-radius:99px;padding:4px 8px;font-size:12px;font-weight:700}.warn{background:#fff7ed;color:var(--amber);padding:10px;border-radius:10px;font-size:13px}.ok{background:#ecfdf5;color:#166534;padding:10px;border-radius:10px;font-size:13px}.hidden{display:none!important}.checkrow{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:7px 0}.checkrow input{width:auto}.footer{font-size:12px;color:var(--muted);text-align:center;padding:20px 5px}.empty{padding:20px;text-align:center;color:var(--muted)}@media(min-width:700px){.wrap{padding:20px 22px 60px}.nav{top:76px}}
</style></head><body>
<header><h1>Control de Despensas</h1><p>Inventario · Producción · Entregas · Pedidos</p></header><main class="wrap"><div class="nav" id="nav"></div><div id="app"></div><div class="footer">Versión inicial gratuita · Los datos se guardan en este navegador. Exporta respaldos con frecuencia.</div></main>
<script>
const KEY='control_despensas_v1';const units=['kg','g','L','ml','pieza','paquete','bolsa','rollo','sobre','caja','botella','barra','unidad'];
const initial=()=>{let raw=[['Azúcar','kg'],['Arroz','kg'],['Frijol','kg'],['Pasta','paquete'],['Galletas','rollo'],['Papel higiénico','paquete'],['Gelatina','sobre'],['Sal','kg'],['Aceite','botella'],['Jabón','paquete']].map((x,i)=>({id:'m'+(i+1),name:x[0],unit:x[1],stock:0}));let recipes=[{id:'r1',name:'Sencilla',ingredients:[['m1',1],['m2',1],['m3',1],['m4',1],['m5',1],['m6',1],['m7',1]].map(x=>({materialId:x[0],qty:x[1]}))},{id:'r2',name:'Premium',ingredients:[['m1',1],['m2',1],['m3',1],['m4',1],['m5',1],['m6',1],['m7',1],['m8',1],['m9',1],['m10',1]].map(x=>({materialId:x[0],qty:x[1]}))}];let now=new Date();let d=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');return {materials:raw,recipes,finished:{},intervals:[{id:'i1',name:'Pedido del '+d,date:d,active:true,closed:false,recipeIds:['r1','r2'],recipeSnapshots:JSON.parse(JSON.stringify(recipes)),openingMaterials:raw.map(m=>({materialId:m.id,qty:0})),produced:{},delivered:{},deliveries:[],production:[]}],activeIntervalId:'i1',movements:[],nextId:3};};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial()}catch(e){state=initial()}let tab='Resumen';let selectedInterval=state.activeIntervalId;let prodCounts={};let recipeDraft=null;let editRecipeId=null;let newIntervalDraft=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state));}function uid(prefix='x'){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){return Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:3})}function dateMX(s){if(!s)return '';let [y,m,d]=s.split('-');return `${d}/${m}/${y}`}function active(){return state.intervals.find(i=>i.id===state.activeIntervalId)||state.intervals[0]}function mat(id){return state.materials.find(m=>m.id===id)}function rec(id){return state.recipes.find(r=>r.id===id)}function snapRecipe(interval,id){return (interval.recipeSnapshots||[]).find(r=>r.id===id)||rec(id)}function recipeName(interval,id){return (snapRecipe(interval,id)||{}).name||'Receta eliminada'}function finishedCount(id){return Number(state.finished[id]||0)}function intervalCount(obj,id){return Number(obj?.[id]||0)}function capFor(r,available=state.materials){if(!r||!r.ingredients.length)return 0;let vals=r.ingredients.map(it=>{let m=available.find(x=>x.id===it.materialId);return !m||Number(it.qty)<=0?0:Math.floor((Number(m.stock)+1e-9)/Number(it.qty))});return vals.length?Math.max(0,Math.min(...vals)):0}
function nav(){let tabs=['Resumen','Materiales','Producción','Entregas','Recetas','Pedidos','Informes'];document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="go('${t}')">${t}</button>`).join('')}function go(t){tab=t;render()}
function render(){nav();let root=document.getElementById('app');let i=active();if(tab==='Resumen')root.innerHTML=renderSummary(i);if(tab==='Materiales')root.innerHTML=renderMaterials();if(tab==='Producción')root.innerHTML=renderProduction(i);if(tab==='Entregas')root.innerHTML=renderDeliveries(i);if(tab==='Recetas')root.innerHTML=renderRecipes();if(tab==='Pedidos')root.innerHTML=renderIntervals();if(tab==='Informes')root.innerHTML=renderReports(i)}
function renderSummary(i){let ids=i?.recipeIds||[];let rows=ids.map(id=>`<div class="stat"><div class="lbl">${esc(recipeName(i,id))} · disponibles</div><div class="num">${fmt(finishedCount(id))}</div><div class="muted">Producidas en pedido: ${fmt(intervalCount(i.produced,id))}<br>Entregadas en pedido: ${fmt(intervalCount(i.delivered,id))}</div></div>`).join('');return `<div class="card"><div class="row"><div><h2>${esc(i?.name||'Sin pedido activo')}</h2><div class="muted">${dateMX(i?.date)} · ${i?.closed?'Cerrado':'Activo'}</div></div><button class="btn fit" onclick="go('Pedidos')">+ Nuevo pedido</button></div><p class="muted">Este resumen muestra exclusivamente los tipos de despensa seleccionados para el pedido activo. Las existencias físicas se mantienen por tipo.</p></div><div class="grid">${rows||'<div class="card empty">Este pedido no tiene tipos de despensa seleccionados.</div>'}</div><div class="card"><h2>Materia prima (vista rápida)</h2><div class="muted">No se muestra el detalle de materia prima en el resumen, tal como se acordó.</div><p>Productos registrados: <b>${state.materials.length}</b> · Tipos de despensa en este pedido: <b>${ids.length}</b></p></div><div class="card"><h2>Últimos movimientos</h2>${state.movements.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Movimiento</th><th>Producto</th><th>Cantidad</th></tr></thead><tbody>${state.movements.slice(-5).reverse().map(m=>`<tr><td>${dateMX(m.date)}</td><td>${esc(m.type)}</td><td>${esc(m.materialName)}</td><td>${fmt(m.qty)} ${esc(m.unit)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay movimientos de materia prima.</div>'}</div>`}
function renderMaterials(){return `<div class="card"><h2>Materia prima</h2><p class="muted">El inventario se registra en la unidad base de cada producto. Para iniciar un pedido, captura el conteo físico completo en Pedidos.</p><div class="tablewrap"><table><thead><tr><th>Producto</th><th>Unidad base</th><th>Existencia</th><th>Acciones</th></tr></thead><tbody>${state.materials.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.unit)}</td><td>${fmt(m.stock)}</td><td><button class="btn secondary small" onclick="editMaterial('${m.id}')">Editar</button> <button class="btn secondary small" onclick="movement('${m.id}','Entrada')">+ Entrada</button></td></tr>`).join('')}</tbody></table></div><h3 style="margin-top:18px">Agregar materia prima</h3><div class="row"><div><label>Nombre</label><input id="matName" placeholder="Ej. Avena"></div><div><label>Unidad base</label><select id="matUnit">${units.map(u=>`<option>${u}</option>`).join('')}</select></div></div><button class="btn" style="margin-top:10px" onclick="addMaterial()">Agregar producto</button></div><div class="card"><h2>Movimientos manuales</h2><p class="muted">Puedes registrar entradas y, si alguna vez lo necesitas, merma o devolución. Estos movimientos no sustituyen el conteo físico al crear un pedido.</p></div>`}
function renderProduction(i){let ids=i.recipeIds||[];let fields=ids.map(id=>`<div class="ingredient"><div class="row"><strong>${esc(recipeName(i,id))}</strong><span class="pill">Disponibles: ${finishedCount(id)}</span></div><label>Unidades a producir</label><input type="number" min="0" step="1" id="prod_${id}" value="${esc(prodCounts[id]??0)}" oninput="prodCounts['${id}']=this.value;updateProductionPreview()"><div class="muted" id="cap_${id}">Máximo individual con la materia prima actual: ${capFor(snapRecipe(i,id))}</div></div>`).join('');return `<div class="card"><h2>Registrar producción</h2><p class="muted">Pedido: ${esc(i.name)}. Solo aparecen los tipos seleccionados para este pedido.</p>${fields||'<div class="empty">Este pedido no tiene recetas. Crea o selecciona tipos desde Pedidos.</div>'}<div id="prodPreview" class="warn">Introduce las cantidades que deseas producir; revisaremos todos los ingredientes compartidos antes de confirmar.</div><button class="btn" onclick="confirmProduction()">Confirmar producción</button></div><div class="card"><h2>Capacidad máxima individual</h2><div class="muted">Cada cifra supone fabricar únicamente ese tipo con el inventario actual. No se suman capacidades individuales porque las recetas pueden compartir materia prima.</div>${ids.map(id=>`<p><b>${esc(recipeName(i,id))}:</b> ${capFor(snapRecipe(i,id))} despensas</p>`).join('')}</div>`}
function renderDeliveries(i){let ids=i.recipeIds||[];return `<div class="card"><h2>Registrar entrega</h2><label>Tipo de despensa</label><select id="delRecipe">${ids.map(id=>`<option value="${id}">${esc(recipeName(i,id))} — disponibles: ${finishedCount(id)}</option>`).join('')}</select><div class="row"><div><label>Cantidad</label><input id="delQty" type="number" min="1" step="1" value="1"></div><div><label>Fecha</label><input id="delDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="row"><div><label>Persona / institución</label><input id="delRecipient" placeholder="Nombre del beneficiario o institución"></div><div><label>Comunidad</label><input id="delCommunity" placeholder="Comunidad"></div></div><label>Folio (opcional)</label><input id="delFolio" placeholder="Folio o referencia"><label>Observaciones (opcional)</label><textarea id="delNotes" placeholder="Notas de la entrega"></textarea><button class="btn" style="margin-top:12px" onclick="confirmDelivery()">Registrar entrega</button></div><div class="card"><h2>Entregas de este pedido</h2>${i.deliveries?.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Cantidad</th><th>Destinatario</th><th>Comunidad</th></tr></thead><tbody>${i.deliveries.slice().reverse().map(d=>`<tr><td>${dateMX(d.date)}</td><td>${esc(recipeName(i,d.recipeId))}</td><td>${d.qty}</td><td>${esc(d.recipient)}</td><td>${esc(d.community)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay entregas registradas en este pedido.</div>'}</div>`}
function renderRecipes(){return `<div class="card"><div class="row"><div><h2>Catálogo de recetas</h2><p class="muted">Crea cualquier número de tipos de despensa. Cada pedido guarda una copia de las recetas que utiliza.</p></div><button class="btn fit" onclick="newRecipe()">+ Nueva receta</button></div>${state.recipes.map(r=>`<div class="ingredient"><div class="row"><div><h3>${esc(r.name)}</h3><div class="muted">${r.ingredients.length} ingredientes</div></div><button class="btn secondary small fit" onclick="editRecipe('${r.id}')">Editar</button></div><ul>${r.ingredients.map(it=>{let m=mat(it.materialId);return `<li>${esc(m?.name||'Producto eliminado')}: ${fmt(it.qty)} ${esc(m?.unit||'unidad')}</li>`}).join('')}</ul></div>`).join('')||'<div class="empty">No hay recetas registradas.</div>'}</div>${recipeDraft?renderRecipeEditor():''}`}
function renderRecipeEditor(){let r=recipeDraft;return `<div class="card"><h2>${editRecipeId?'Editar receta':'Crear receta'}</h2><label>Nombre del tipo de despensa</label><input id="recipeName" value="${esc(r.name)}" placeholder="Ej. Navideña"><h3 style="margin-top:16px">Ingredientes y cantidades por despensa</h3>${r.ingredients.map((it,idx)=>`<div class="ingredient"><div class="row"><div style="flex:2"><label>Producto</label><select id="ri_mat_${idx}">${state.materials.map(m=>`<option value="${m.id}" ${m.id===it.materialId?'selected':''}>${esc(m.name)} (${esc(m.unit)})</option>`).join('')}</select></div><div><label>Cantidad</label><input id="ri_qty_${idx}" type="number" min="0.001" step="any" value="${esc(it.qty)}"></div><button class="btn danger small fit" onclick="removeIngredient(${idx})">Quitar</button></div></div>`).join('')}<button class="btn secondary" onclick="addIngredientRow()">+ Agregar ingrediente existente</button><div class="card" style="background:#f8fbf8"><h3>¿Falta un producto?</h3><div class="row"><div><label>Nombre de materia prima</label><input id="newMatName" placeholder="Ej. Canela"></div><div><label>Unidad base</label><select id="newMatUnit">${units.map(u=>`<option>${u}</option>`).join('')}</select></div></div><button class="btn secondary" style="margin-top:8px" onclick="addMaterialFromRecipe()">Guardar materia prima y agregarla</button></div><div class="row"><button class="btn" onclick="saveRecipe()">Guardar receta</button><button class="btn secondary" onclick="cancelRecipe()">Cancelar</button></div></div>`}
function renderIntervals(){let i=active();return `<div class="card"><h2>Nuevo pedido / nuevo conteo</h2><p class="muted">El conteo físico de materia prima que captures reemplazará el saldo actual, incluyendo sobrantes y nuevas compras. No se sumará dos veces el sobrante. El inventario de despensas terminadas se conserva.</p><label>Nombre del pedido (opcional)</label><input id="newOrderName" placeholder="Ej. Pedido de noviembre"><div class="row"><div><label>Fecha de llegada</label><input id="newOrderDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><h3 style="margin-top:16px">¿Qué recetas quieres utilizar?</h3><label class="checkrow"><input type="checkbox" id="reuseRecipes" checked onchange="toggleRecipeChoice()"> Utilizar las recetas actuales</label><div id="recipeChoice">${state.recipes.map(r=>`<label class="checkrow"><input type="checkbox" name="orderRecipe" value="${r.id}" ${i.recipeIds.includes(r.id)?'checked':''}> ${esc(r.name)}</label>`).join('')}<button class="btn secondary" onclick="go('Recetas')">Crear o editar recetas</button></div><div id="newRecipeChoice" class="hidden"><div class="warn">Primero crea y guarda la nueva receta en el apartado Recetas. Después regresa a este formulario, selecciona “Utilizar las recetas actuales” y marca el nuevo tipo para incluirlo en el pedido.</div><button class="btn secondary" onclick="go('Recetas')">+ Crear nueva receta</button></div><h3 style="margin-top:16px">Conteo físico de materia prima</h3><div class="muted">Escribe las existencias reales después de sumar mentalmente sobrantes + nueva compra.</div>${state.materials.map(m=>`<div class="row" style="margin:8px 0"><div>${esc(m.name)} <span class="muted">(${esc(m.unit)})</span></div><div><input type="number" min="0" step="any" id="opening_${m.id}" value="${m.stock}" aria-label="Existencia de ${esc(m.name)}"></div></div>`).join('')}<h3 style="margin-top:16px">Tipos de despensa que ya están terminados</h3><div class="muted">Si hay producto terminado de recetas históricas, también se conserva; aquí puedes ajustar las existencias físicas actuales.</div>${state.recipes.map(r=>`<div class="row" style="margin:8px 0"><div>${esc(r.name)} (actual: ${finishedCount(r.id)})</div><div><input type="number" min="0" step="1" id="finished_${r.id}" value="${finishedCount(r.id)}"></div></div>`).join('')}<button class="btn" style="margin-top:14px" onclick="createInterval()">Crear pedido</button></div><div class="card"><h2>Historial de pedidos</h2>${state.intervals.slice().reverse().map(it=>`<div class="ingredient"><div class="row"><div><b>${esc(it.name)}</b><div class="muted">${dateMX(it.date)} · ${it.closed?'Cerrado':'Activo'} · ${it.recipeIds.length} tipos</div></div>${it.id===state.activeIntervalId?'<span class="pill">Actual</span>':`<button class="btn secondary small fit" onclick="selectInterval('${it.id}')">Ver resumen</button>`}</div><div class="muted">${it.recipeIds.map(id=>esc(recipeName(it,id))).join(', ')}</div>${!it.closed&&it.id!==state.activeIntervalId?`<button class="btn danger small" onclick="closeInterval('${it.id}')">Cerrar intervalo</button>`:''}${it.id===state.activeIntervalId&&!it.closed?`<button class="btn danger small" style="margin-top:8px" onclick="closeInterval('${it.id}')">Cerrar intervalo actual</button>`:''}</div>`).join('')}</div>`}
function renderReports(i){return `<div class="card"><h2>Informes y respaldos</h2><p class="muted">Descarga archivos CSV compatibles con Excel y un respaldo JSON completo para recuperar tus datos en este navegador u otro dispositivo.</p><div class="row"><button class="btn" onclick="exportIntervalCSV()">Exportar informe del pedido</button><button class="btn secondary" onclick="exportAllCSV()">Exportar tablas CSV</button></div><div class="row" style="margin-top:8px"><button class="btn secondary" onclick="backupJSON()">Descargar respaldo completo</button><label class="btn secondary" style="text-align:center;cursor:pointer">Restaurar respaldo JSON<input type="file" accept="application/json,.json" style="display:none" onchange="restoreJSON(event)"></label></div><div class="warn" style="margin-top:12px">Importante: el almacenamiento actual es local a este navegador y dispositivo. No sincroniza automáticamente con otros dispositivos. Descarga respaldos regularmente; para usarlo como app web con sincronización será necesario publicarlo en un servicio gratuito y configurar una base de datos.</div><h3 style="margin-top:16px">Resumen del pedido actual</h3><div class="tablewrap"><table><thead><tr><th>Tipo</th><th>Existencia actual</th><th>Producidas en pedido</th><th>Entregadas en pedido</th><th>Saldo del pedido*</th></tr></thead><tbody>${i.recipeIds.map(id=>`<tr><td>${esc(recipeName(i,id))}</td><td>${finishedCount(id)}</td><td>${intervalCount(i.produced,id)}</td><td>${intervalCount(i.delivered,id)}</td><td>${intervalCount(i.produced,id)-intervalCount(i.delivered,id)}</td></tr>`).join('')}</tbody></table></div><p class="muted">*El saldo del pedido es producción menos entregas registradas en este intervalo; la existencia física incluye sobrantes anteriores.</p></div><div class="card"><h2>Historial de movimientos de materia prima</h2>${state.movements.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Movimiento</th><th>Producto</th><th>Cantidad</th><th>Pedido</th></tr></thead><tbody>${state.movements.slice().reverse().map(m=>`<tr><td>${dateMX(m.date)}</td><td>${esc(m.type)}</td><td>${esc(m.materialName)}</td><td>${fmt(m.qty)} ${esc(m.unit)}</td><td>${esc(m.intervalName||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sin movimientos registrados.</div>'}</div>`}
function addMaterial(){let name=document.getElementById('matName').value.trim(),unit=document.getElementById('matUnit').value;if(!name)return alert('Escribe el nombre del producto.');if(state.materials.some(m=>m.name.toLowerCase()===name.toLowerCase()))return alert('Ese producto ya está registrado.');state.materials.push({id:uid('m'),name,unit,stock:0});save();render()}function editMaterial(id){let m=mat(id);let name=prompt('Nombre del producto:',m.name);if(name===null)return;name=name.trim();if(!name)return alert('El nombre no puede quedar vacío.');let unit=prompt('Unidad base ('+units.join(', ')+'):',m.unit);if(unit===null)return;unit=unit.trim();if(!units.includes(unit))return alert('Unidad no reconocida. Usa: '+units.join(', '));m.name=name;m.unit=unit;save();render()}function movement(id,type){let m=mat(id);let q=Number(prompt(type+' de '+m.name+' ('+m.unit+'). Cantidad:', '1'));if(!Number.isFinite(q)||q<=0)return;if(type==='Merma'&&q>m.stock)return alert('La merma no puede superar la existencia.');if(type==='Entrada')m.stock+=q;else if(type==='Merma')m.stock-=q;else m.stock+=q;state.movements.push({date:new Date().toISOString().slice(0,10),type,materialId:id,materialName:m.name,qty:q,unit:m.unit,intervalName:active().name});save();render()}
function newRecipe(){editRecipeId=null;recipeDraft={id:uid('r'),name:'',ingredients:[]};go('Recetas');render()}function editRecipe(id){let r=rec(id);editRecipeId=id;recipeDraft=JSON.parse(JSON.stringify(r));render()}function addIngredientRow(){if(!state.materials.length)return alert('Primero registra materia prima.');recipeDraft.ingredients.push({materialId:state.materials[0].id,qty:1});render()}function removeIngredient(idx){recipeDraft.ingredients.splice(idx,1);render()}function addMaterialFromRecipe(){let name=document.getElementById('newMatName').value.trim(),unit=document.getElementById('newMatUnit').value;if(!name)return alert('Escribe el nombre del producto.');let m=state.materials.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!m){m={id:uid('m'),name,unit,stock:0};state.materials.push(m)}else if(m.unit!==unit)return alert('Ese producto ya existe con unidad '+m.unit+'.');recipeDraft.ingredients.push({materialId:m.id,qty:1});save();render()}function saveRecipe(){let name=document.getElementById('recipeName').value.trim();if(!name)return alert('Escribe un nombre para la receta.');let ingredients=[];for(let idx=0;idx<recipeDraft.ingredients.length;idx++){let materialId=document.getElementById('ri_mat_'+idx)?.value;let qty=Number(document.getElementById('ri_qty_'+idx)?.value);if(!materialId||!Number.isFinite(qty)||qty<=0)return alert('Revisa las cantidades: deben ser mayores que cero.');ingredients.push({materialId,qty})}if(!ingredients.length)return alert('Agrega al menos un ingrediente.');if(state.recipes.some(r=>r.name.toLowerCase()===name.toLowerCase()&&r.id!==editRecipeId))return alert('Ya existe una receta con ese nombre.');if(editRecipeId){let r=rec(editRecipeId);r.name=name;r.ingredients=ingredients}else{recipeDraft.name=name;recipeDraft.ingredients=ingredients;state.recipes.push(recipeDraft)}// Update only future recipe catalog. Existing interval snapshots are intentionally unchanged.
recipeDraft=null;editRecipeId=null;save();render()}function cancelRecipe(){recipeDraft=null;editRecipeId=null;render()}
function toggleRecipeChoice(){let reuse=document.getElementById('reuseRecipes').checked;document.getElementById('recipeChoice').classList.toggle('hidden',!reuse);document.getElementById('newRecipeChoice').classList.toggle('hidden',reuse)}
function createInterval(){let date=document.getElementById('newOrderDate').value;if(!date)return alert('Selecciona la fecha del pedido.');let useCurrent=document.getElementById('reuseRecipes').checked;let ids=Array.from(document.querySelectorAll('input[name="orderRecipe"]:checked')).map(x=>x.value);if(useCurrent&&ids.length===0)return alert('Selecciona al menos un tipo de despensa. Si acabas de crear una receta, selecciónala en la lista.');if(!useCurrent){return alert('Primero crea y guarda las recetas nuevas en la pestaña Recetas; después vuelve aquí y selecciona las que llevará el pedido.')}for(let m of state.materials){let q=Number(document.getElementById('opening_'+m.id).value);if(!Number.isFinite(q)||q<0)return alert('Revisa el conteo de '+m.name);m.stock=q}for(let r of state.recipes){let el=document.getElementById('finished_'+r.id);if(el){let q=Number(el.value);if(!Number.isInteger(q)||q<0)return alert('Revisa existencias terminadas de '+r.name);state.finished[r.id]=q}}let name=document.getElementById('newOrderName').value.trim()||('Pedido del '+dateMX(date));state.intervals.forEach(x=>x.active=false);let snaps=ids.map(id=>JSON.parse(JSON.stringify(rec(id))));let it={id:uid('i'),name,date,active:true,closed:false,recipeIds:ids,recipeSnapshots:snaps,openingMaterials:state.materials.map(m=>({materialId:m.id,qty:m.stock})),produced:{},delivered:{},deliveries:[],production:[]};state.intervals.push(it);state.activeIntervalId=it.id;selectedInterval=it.id;prodCounts={};save();go('Resumen')}
function selectInterval(id){selectedInterval=id;let it=state.intervals.find(x=>x.id===id);alert('Pedido seleccionado para consulta: '+it.name+'. El pedido operativo activo sigue siendo '+active().name+'.');go('Pedidos')}function closeInterval(id){let it=state.intervals.find(x=>x.id===id);if(!it)return;if(!confirm('¿Cerrar '+it.name+'? Se conservará en el historial.'))return;it.closed=true;it.active=false;if(state.activeIntervalId===id){let open=state.intervals.slice().reverse().find(x=>!x.closed);if(open){state.activeIntervalId=open.id;open.active=true}}save();render()}
function confirmProduction(){let i=active(),ids=i.recipeIds||[],counts={};for(let id of ids){let q=Number(document.getElementById('prod_'+id)?.value||0);if(!Number.isInteger(q)||q<0)return alert('Las cantidades deben ser números enteros iguales o mayores que cero.');counts[id]=q}if(!Object.values(counts).some(q=>q>0))return alert('Indica al menos una cantidad a producir.');let needs={};for(let id of ids){let r=snapRecipe(i,id);for(let it of (r?.ingredients||[])){needs[it.materialId]=(needs[it.materialId]||0)+Number(it.qty)*counts[id]}}let missing=[];for(let [mid,q] of Object.entries(needs)){let m=mat(mid);if(!m||m.stock+1e-9<q)missing.push(`${m?.name||'Producto eliminado'}: requiere ${fmt(q)} ${m?.unit||''}, disponible ${fmt(m?.stock||0)}`)}if(missing.length)return alert('No hay materia prima suficiente:\n'+missing.join('\n'));for(let [mid,q] of Object.entries(needs))mat(mid).stock-=q;for(let id of ids){let q=counts[id];state.finished[id]=finishedCount(id)+q;i.produced[id]=intervalCount(i.produced,id)+q}i.production.push({date:new Date().toISOString().slice(0,10),counts,needs});save();render();alert('Producción registrada correctamente. Se descontó la materia prima y aumentó el inventario de producto terminado.')}
function confirmDelivery(){let i=active(),id=document.getElementById('delRecipe')?.value;if(!id)return alert('Este pedido no tiene tipos de despensa seleccionados.');let q=Number(document.getElementById('delQty').value);if(!Number.isInteger(q)||q<1)return alert('La cantidad debe ser un entero mayor que cero.');if(q>finishedCount(id))return alert('No hay suficientes despensas disponibles. Existencia: '+finishedCount(id));let date=document.getElementById('delDate').value;if(!date)return alert('Selecciona la fecha.');let d={id:uid('d'),date,recipeId:id,qty:q,recipient:document.getElementById('delRecipient').value.trim(),community:document.getElementById('delCommunity').value.trim(),folio:document.getElementById('delFolio').value.trim(),notes:document.getElementById('delNotes').value.trim()};state.finished[id]=finishedCount(id)-q;i.delivered[id]=intervalCount(i.delivered,id)+q;i.deliveries.push(d);save();render();alert('Entrega registrada. Se actualizaron las existencias y el contador del pedido.')}
function updateProductionPreview(){let i=active(),needs={};for(let id of i.recipeIds){let q=Number(document.getElementById('prod_'+id)?.value||0);let r=snapRecipe(i,id);for(let it of (r?.ingredients||[]))needs[it.materialId]=(needs[it.materialId]||0)+it.qty*q}let lines=Object.entries(needs).map(([id,q])=>{let m=mat(id);return `${m?.name||'Producto'}: ${fmt(q)} ${m?.unit||''} (hay ${fmt(m?.stock||0)})`});let box=document.getElementById('prodPreview');if(box)box.innerHTML=lines.length?'<b>Materia prima requerida:</b><br>'+lines.map(esc).join('<br>'):'Introduce cantidades para calcular los ingredientes.'}
function download(name,content,type='text/plain;charset=utf-8'){let blob=new Blob(['\ufeff',content],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function csv(rows){return rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}function exportIntervalCSV(){let i=active(),rows=[['Pedido',i.name],['Fecha',i.date],[],['Tipo de despensa','Existencia actual','Producidas en pedido','Entregadas en pedido','Producción menos entregas']];for(let id of i.recipeIds)rows.push([recipeName(i,id),finishedCount(id),intervalCount(i.produced,id),intervalCount(i.delivered,id),intervalCount(i.produced,id)-intervalCount(i.delivered,id)]);rows.push([],['Entregas'],['Fecha','Tipo','Cantidad','Destinatario','Comunidad','Folio','Observaciones']);for(let d of i.deliveries)rows.push([d.date,recipeName(i,d.recipeId),d.qty,d.recipient,d.community,d.folio,d.notes]);download('informe_'+i.date+'.csv',csv(rows),'text/csv;charset=utf-8')}
function exportAllCSV(){let datasets=[['materia_prima.csv',[['ID','Producto','Unidad','Existencia'],...state.materials.map(m=>[m.id,m.name,m.unit,m.stock])]],['recetas.csv',[['Receta','Producto','Cantidad por despensa','Unidad'],...state.recipes.flatMap(r=>r.ingredients.map(it=>[r.name,mat(it.materialId)?.name||it.materialId,it.qty,mat(it.materialId)?.unit||'']))]],['pedidos.csv',[['Pedido','Fecha','Estado','Tipos'],...state.intervals.map(i=>[i.name,i.date,i.closed?'Cerrado':'Abierto',i.recipeIds.map(id=>recipeName(i,id)).join(' | ')])]],['produccion.csv',[['Pedido','Fecha','Tipo','Cantidad'],...state.intervals.flatMap(i=>i.production.flatMap(p=>Object.entries(p.counts).map(([id,q])=>[i.name,p.date,recipeName(i,id),q]))) ]],['entregas.csv',[['Pedido','Fecha','Tipo','Cantidad','Destinatario','Comunidad','Folio','Observaciones'],...state.intervals.flatMap(i=>i.deliveries.map(d=>[i.name,d.date,recipeName(i,d.recipeId),d.qty,d.recipient,d.community,d.folio,d.notes]))]],['movimientos.csv',[['Fecha','Movimiento','Producto','Cantidad','Unidad','Pedido'],...state.movements.map(m=>[m.date,m.type,m.materialName,m.qty,m.unit,m.intervalName])]]];let content=datasets.map(([name,rows])=>'### '+name+'\n'+csv(rows)).join('\n\n');download('tablas_despensas.csv.txt',content)}function backupJSON(){download('respaldo_despensas_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json;charset=utf-8')}function restoreJSON(ev){let f=ev.target.files?.[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let parsed=JSON.parse(rd.result);if(!parsed.materials||!parsed.recipes||!parsed.intervals)throw Error('Formato no válido');if(!confirm('Esto reemplazará los datos actuales de este navegador. ¿Continuar?'))return;state=parsed;save();render();alert('Respaldo restaurado.')}catch(e){alert('No se pudo restaurar: '+e.message)}};rd.readAsText(f)}
render();
